[package]
name = "facelesscreator-desktop"
version = "0.1.0"
description = "Native desktop shell for FacelessCreator"
authors = ["FacelessCreator"]
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"

[lib]
name = "facelesscreator_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "FacelessCreator"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
